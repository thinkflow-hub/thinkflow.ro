<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Montserrat, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" fill="#0a0a0f" rx="12"/>

  <defs>
    <clipPath id="clipVennA"><circle cx="376.4" cy="252.5" r="150"/></clipPath>
    <clipPath id="clipVennB"><circle cx="523.6" cy="252.5" r="150"/></clipPath>
    <clipPath id="clipVennC"><circle cx="450" cy="380" r="150"/></clipPath>
  </defs>

  <!-- title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="1">THE LETHAL TRIFECTA</text>
  <text x="450" y="58" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="11">Any two of these are fine on their own. All three, in the same turn, are not.</text>

  <!-- three circles -->
  <circle cx="376.4" cy="252.5" r="150" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="523.6" cy="252.5" r="150" fill="rgba(168,85,247,0.25)" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="450" cy="380" r="150" fill="rgba(34,197,94,0.25)" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- two-circle overlaps: lightly labeled, neutral -->
  <text x="450" y="215" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10" font-weight="600" letter-spacing="0.5">R + U</text>
  <text x="350" y="358" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10" font-weight="600" letter-spacing="0.5">R + X</text>
  <text x="550" y="358" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="10" font-weight="600" letter-spacing="0.5">U + X</text>

  <!-- triple overlap: solid danger fill via nested clip intersection, on top of everything -->
  <g clip-path="url(#clipVennA)">
    <g clip-path="url(#clipVennB)">
      <g clip-path="url(#clipVennC)">
        <rect x="0" y="0" width="900" height="600" fill="rgba(239,68,68,0.5)"/>
      </g>
    </g>
  </g>
  <text x="450" y="294" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="1.5">DANGER</text>
  <text x="450" y="313" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700" letter-spacing="1">ALL THREE PRESENT</text>

  <!-- capability tags: outer labels, color-matched to their circle -->
  <rect x="50" y="116" width="230" height="32" rx="6" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1"/>
  <text x="165" y="137" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-weight="700" letter-spacing="0.3">R — READS PRIVATE DATA</text>

  <rect x="620" y="116" width="230" height="32" rx="6" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1"/>
  <text x="735" y="137" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-weight="700" letter-spacing="0.3">U — UNTRUSTED CONTENT</text>

  <rect x="345" y="545" width="210" height="32" rx="6" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1"/>
  <text x="450" y="566" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11" font-weight="700" letter-spacing="0.3">X — EXTERNAL EXFIL PATH</text>

