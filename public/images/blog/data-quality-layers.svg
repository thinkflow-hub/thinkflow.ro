<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Montserrat, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="450" fill="#0a0a0f" rx="12"/>
  <text x="450" y="36" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-weight="700" letter-spacing="1.5">WHAT EACH CHECK CAN AND CANNOT CATCH</text>

  <g font-size="11.5" font-weight="700">
    <text x="410" y="72" text-anchor="middle" fill="rgba(255,255,255,0.45)">WRONG TYPE</text>
    <text x="530" y="72" text-anchor="middle" fill="rgba(255,255,255,0.45)">ABSURD VALUE</text>
    <text x="665" y="72" text-anchor="middle" fill="rgba(255,255,255,0.45)">PLAUSIBLE BUT WRONG</text>
    <text x="800" y="72" text-anchor="middle" fill="rgba(255,255,255,0.45)">STALE CODE</text>
  </g>

  <g font-size="16" font-weight="700" text-anchor="middle">
    <rect x="36" y="88" width="828" height="52" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="56" y="120" text-anchor="start" fill="rgba(255,255,255,0.8)" font-size="13">Type system</text>
    <text x="410" y="121" fill="#86efac">&#10003;</text>
    <text x="530" y="121" fill="#fca5a5">&#10007;</text>
    <text x="665" y="121" fill="#fca5a5">&#10007;</text>
    <text x="800" y="121" fill="#fca5a5">&#10007;</text>

    <rect x="36" y="148" width="828" height="52" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="56" y="180" text-anchor="start" fill="rgba(255,255,255,0.8)" font-size="13">Range check</text>
    <text x="410" y="181" fill="#86efac">&#10003;</text>
    <text x="530" y="181" fill="#86efac">&#10003;</text>
    <text x="665" y="181" fill="#fca5a5">&#10007;</text>
    <text x="800" y="181" fill="#fca5a5">&#10007;</text>

    <rect x="36" y="208" width="828" height="52" rx="6" fill="rgba(255,255,255,0.03)"/>
    <text x="56" y="240" text-anchor="start" fill="rgba(255,255,255,0.8)" font-size="13">Cross-field consistency</text>
    <text x="410" y="241" fill="#86efac">&#10003;</text>
    <text x="530" y="241" fill="#86efac">&#10003;</text>
    <text x="665" y="241" fill="#fbbf24">~</text>
    <text x="800" y="241" fill="#fca5a5">&#10007;</text>

    <rect x="36" y="268" width="828" height="52" rx="6" fill="rgba(59,130,246,0.09)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="56" y="300" text-anchor="start" fill="rgba(255,255,255,0.9)" font-size="13">Compare against the source text</text>
    <text x="410" y="301" fill="#86efac">&#10003;</text>
    <text x="530" y="301" fill="#86efac">&#10003;</text>
    <text x="665" y="301" fill="#86efac">&#10003;</text>
    <text x="800" y="301" fill="#fca5a5">&#10007;</text>

    <rect x="36" y="328" width="828" height="52" rx="6" fill="rgba(59,130,246,0.09)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="56" y="360" text-anchor="start" fill="rgba(255,255,255,0.9)" font-size="13">Restart discipline after a fix</text>
    <text x="410" y="361" fill="rgba(255,255,255,0.2)">&#183;</text>
    <text x="530" y="361" fill="rgba(255,255,255,0.2)">&#183;</text>
    <text x="665" y="361" fill="rgba(255,255,255,0.2)">&#183;</text>
    <text x="800" y="361" fill="#86efac">&#10003;</text>
  </g>

  <text x="450" y="412" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="13" font-weight="700">The two rows that catch what everything else misses are the two nobody builds first.</text>
  <text x="450" y="434" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="11.5">Cross-field: a &#8364;400 apartment recorded as 400 m&#178; &#8212; 70 rows, both fields individually valid.</text>
</svg>
