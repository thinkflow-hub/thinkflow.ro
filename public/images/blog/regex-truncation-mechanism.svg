<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Montserrat, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#0a0a0f" rx="12"/>
  <text x="450" y="36" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="13" font-weight="700" letter-spacing="1.5">HOW THE ENGINE LOSES THE FIRST DIGIT</text>

  <text x="450" y="82" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="12">input string</text>
  <g font-family="Consolas, monospace" font-size="40" font-weight="700">
    <text x="352" y="130" fill="#fca5a5">1</text>
    <text x="382" y="130" fill="rgba(255,255,255,0.9)">2</text>
    <text x="412" y="130" fill="rgba(255,255,255,0.9)">3</text>
    <text x="442" y="130" fill="rgba(255,255,255,0.9)">0</text>
    <text x="486" y="130" fill="rgba(255,255,255,0.55)">€</text>
  </g>

  <text x="118" y="196" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="700">Attempt 1 — position 0</text>
  <rect x="345" y="172" width="94" height="34" rx="4" fill="rgba(239,68,68,0.14)" stroke="rgba(239,68,68,0.55)" stroke-width="1.3"/>
  <text x="392" y="195" text-anchor="middle" fill="#fca5a5" font-family="Consolas, monospace" font-size="17" font-weight="700">123</text>
  <text x="470" y="195" fill="rgba(239,68,68,0.85)" font-size="12.5">next char is `0` — not a separator, not `€` → fail</text>

  <text x="118" y="258" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="700">Attempt 2 — position 1</text>
  <rect x="375" y="234" width="94" height="34" rx="4" fill="rgba(34,197,94,0.16)" stroke="rgba(34,197,94,0.6)" stroke-width="1.3"/>
  <text x="422" y="257" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="17" font-weight="700">230</text>
  <text x="500" y="257" fill="rgba(34,197,94,0.85)" font-size="12.5">followed by space, then `€` → clean match</text>

  <line x1="392" y1="212" x2="415" y2="232" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="286" y="228" fill="rgba(255,255,255,0.3)" font-size="11" font-style="italic">engine advances 1 char</text>

  <rect x="118" y="300" width="664" height="62" rx="8" fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.42)" stroke-width="1.2"/>
  <text x="450" y="326" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="800">Result: the last three digits, always.</text>
  <text x="450" y="349" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="12.5" font-family="Consolas, monospace">1230 → 230 · 1050 → 50 · 1100 → 100 · 1000 → 0</text>

  <text x="450" y="400" text-anchor="middle" fill="rgba(255,255,255,0.42)" font-size="12.5">The fix is eleven characters: a negative lookbehind that forbids starting after a digit.</text>
  <text x="450" y="428" text-anchor="middle" fill="#86efac" font-family="Consolas, monospace" font-size="14" font-weight="700">(?&lt;![\d.,])</text>
</svg>
