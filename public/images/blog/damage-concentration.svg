  <rect x="120" y="300" width="660" height="64" rx="8" fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.4)" stroke-width="1.2"/>
  <text x="450" y="326" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Every corrupted row landed in the &quot;cheapest first&quot; results</text>
  <text x="450" y="348" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="12">A filter for &quot;under €500&quot; returned seven apartments that were never under €500.</text>

  <text x="450" y="398" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="13.5" font-weight="700">The corruption surfaced at the exact moment of a decision — and always as an opportunity.</text>
  <text x="450" y="422" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="12">9 rows out of 999. Under 1%. Every one of them a premium listing.</text>
