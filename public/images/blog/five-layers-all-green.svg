    <rect x="70" y="352" width="760" height="58" rx="7" fill="rgba(34,197,94,0.07)" stroke="rgba(34,197,94,0.35)" stroke-width="1.1"/>
    <circle cx="98" cy="381" r="7" fill="#22c55e" opacity="0.8"/>
    <text x="122" y="377" fill="rgba(255,255,255,0.88)" font-size="14" font-weight="700">Code review</text>
